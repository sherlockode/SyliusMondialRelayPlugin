sylius_twig_hooks:
    hooks:
        sylius_admin.shipment.grid#ship:
            mondial_relay:
                template: "@SherlockodeSyliusMondialRelayPlugin/Admin/Shipment/Grid/Action/_print_ticket.html.twig"
                priority: 5

        sylius_admin.order.show#sidebar:
            mondial_relay:
                template: "@SherlockodeSyliusMondialRelayPlugin/Admin/Order/Show/_pickup_point_address.html.twig"
                priority: 37

        sylius_admin.base#javascripts:
            mondial_relay_scripts:
                template: "@SherlockodeSyliusMondialRelayPlugin/Admin/_javascripts.html.twig"
                priority: -100

        sylius_shop.checkout.select_shipping:
            mondial_relay:
                template: "@SherlockodeSyliusMondialRelayPlugin/Checkout/_modal.html.twig"
                priority: -100

        sylius_shop.checkout.select_shipping.content.form.shipments.shipment:
            mondial_relay:
                template: "@SherlockodeSyliusMondialRelayPlugin/Checkout/_shipments_entry_method_widget.html.twig"
                priority: -10

        sylius_shop.base#javascripts:
            mondial_relay:
                template: "@SherlockodeSyliusMondialRelayPlugin/Checkout/_javascripts.html.twig"
                priority: -100

        sylius_shop.base#stylesheets:
            mondial_relay:
                template: "@SherlockodeSyliusMondialRelayPlugin/Checkout/_stylesheets.html.twig"
                priority: -100